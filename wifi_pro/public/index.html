<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Pro - Security Analyzer</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>WiFi Pro</h1>

    <div id="sessionInfo" class="session-info hidden">
      <span id="usernameLabel"></span>
      <button id="btnLogout" class="btn small">Cerrar sesión</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main">

    <!-- =========================
         LOGIN / REGISTRO
    ========================== -->
    <section id="authSection" class="auth-wrap">

      <!-- LOGIN -->
      <div class="card auth-card">
        <h2>Iniciar sesión</h2>

        <input id="loginUsername" type="text" placeholder="Usuario" required>
        <input id="loginPassword" type="password" placeholder="Contraseña" required>

        <button id="btnLogin" class="btn full">Ingresar</button>
      </div>

      <!-- REGISTRO -->
      <div class="card auth-card">
        <h2>Registro</h2>

        <input id="registerUsername" type="text" placeholder="Usuario (mínimo 3 caracteres)" required>
        <input id="registerPassword" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required>
        <input id="registerConfirm" type="password" placeholder="Confirmar contraseña" required>

        <button id="btnRegister" class="btn full">Registrarse</button>
      </div>

    </section>

    <!-- =========================
         DASHBOARD
    ========================== -->
    <section id="dashboardSection" class="dashboard hidden">

      <div class="container">

        <!-- FORMULARIO -->
        <div class="card form-card">
          <h2>Gestión de Red WiFi</h2>

          <input id="networkName" type="text" placeholder="Nombre de red">

          <select id="networkType">
            <option value="">Tipo de red</option>
            <option value="publica">Pública</option>
            <option value="privada">Privada</option>
          </select>

          <select id="networkEncryption">
            <option value="">Tipo de cifrado</option>
            <option value="none">Ninguno</option>
            <option value="wep">WEP</option>
            <option value="wpa">WPA</option>
            <option value="wpa2">WPA2</option>
            <option value="wpa3">WPA3</option>
          </select>

          <input id="networkPassword" type="password" placeholder="Contraseña (opcional)">

          <button id="btnAnalyzeSelected" class="btn full">Analizar</button>

          <div class="actions">
            <button id="btnAdd" class="btn success">Agregar</button>
            <button id="btnUpdate" class="btn secondary">Editar</button>
            <button id="btnDelete" class="btn danger">Eliminar</button>
            <button id="btnClear" class="btn secondary">Limpiar</button>
          </div>
        </div>

        <!-- RESULTADO -->
        <div class="card result-card">
          <h2>Resultado de Seguridad</h2>

          <div id="riskLevel" class="risk safe">SEGURO</div>
          <div id="riskScore" class="score">0 / 100</div>

          <div class="progress">
            <div id="riskFill" class="progress-bar" style="width:0%"></div>
          </div>

          <div id="riskPercent" class="percent">0%</div>

          <button id="btnAnalyzeAll" class="btn secondary full">
            Analizar todas las redes
          </button>
        </div>

      </div>

      <!-- TABLA -->
      <div class="card table-card">
        <h2>Redes registradas</h2>

        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Cifrado</th>
              <th>Riesgo</th>
            </tr>
          </thead>
          <tbody id="networksTableBody">
            <!-- JS inserta datos aquí -->
          </tbody>
        </table>
      </div>

      <!-- RESUMEN -->
      <div class="card summary-card">
        <h2>Resumen general</h2>

        <div class="summary-grid">
          <div>Total <strong id="sumTotal">0</strong></div>
          <div class="safe">Seguras <strong id="sumSafe">0</strong></div>
          <div class="medium">Medio <strong id="sumMedium">0</strong></div>
          <div class="high">Alto <strong id="sumHigh">0</strong></div>
        </div>
      </div>

      <!-- HISTORIAL -->
      <div class="card history-card">
        <h2>Historial de análisis</h2>
        <ul id="historyList"></ul>
      </div>

    </section>

    <!-- STATUS -->
    <p id="statusMessage" class="status">Listo.</p>

  </main>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
