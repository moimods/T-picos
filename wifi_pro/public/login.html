<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Pro - Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header" role="banner">
    <div class="header-inner container">
      <h1>WiFi Pro</h1>
      <nav class="session-info" aria-label="Navegación de autenticación">
        <a class="btn small" href="register.html">Ir a registro</a>
      </nav>
    </div>
  </header>

  <main class="app-main auth-page" role="main">
    <section class="login-layout" aria-label="Iniciar sesión">
      <!-- LADO IZQUIERDO -->
      <div class="login-left">
        <div class="overlay">
          <h1>WiFi Pro</h1>
          <p>
            Gestiona redes, analiza riesgos y mejora la seguridad
            de tus conexiones de forma inteligente.
          </p>
        </div>
      </div>

      <!-- LADO DERECHO -->
      <div class="login-right">
        <div class="login-card">
          <h2>Iniciar sesión</h2>

          <form id="loginForm" autocomplete="username" onsubmit="return false;">
            <input id="loginUsername" name="username" type="text" placeholder="Usuario" required minlength="3" />
            <input id="loginPassword" name="password" type="password" placeholder="Contraseña" required minlength="6" />

            <button id="btnLogin" class="btn full" type="submit">INICIAR SESIÓN</button>

            <p class="switch">
              ¿No tienes cuenta? <a href="register.html">Regístrate</a>
            </p>
          </form>
        </div>
      </div>
    </section>

    <p id="statusMessage" class="status auth-status" aria-live="polite">Listo.</p>
  </main>

  <script src="login.js"></script>
</body>
</html>
